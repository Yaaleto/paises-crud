<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Países</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Administración de países</h1>
        <a th:href="@{/paises/nuevo}" class="btn btn-primary">+ Nuevo país</a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <table class="table table-striped table-bordered bg-white align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Nombre</th><th>ISO</th><th>Capital</th>
            <th>Continente</th><th class="text-end">Población</th><th style="width: 260px">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(paises)}">
            <td colspan="7" class="text-center text-muted">No hay países registrados</td>
        </tr>
        <tr th:each="p : ${paises}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.nombre}"></td>
            <td th:text="${p.codigoIso}"></td>
            <td th:text="${p.capital}"></td>
            <td th:text="${p.continente}"></td>
            <td class="text-end" th:text="${#numbers.formatInteger(p.poblacion, 1, 'COMMA')}"></td>
            <td>
                <a th:href="@{/paises/{id}(id=${p.id})}" class="btn btn-sm btn-info">Ver</a>
                <a th:href="@{/paises/{id}/editar(id=${p.id})}" class="btn btn-sm btn-warning">Editar</a>
                <form th:action="@{/paises/{id}/eliminar(id=${p.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('¿Eliminar este país?');">
                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
