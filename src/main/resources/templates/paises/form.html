<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de país</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 640px">
    <h1 class="h3 mb-3" th:text="${pais.id == null} ? 'Nuevo país' : 'Editar país'"></h1>

    <form th:action="@{/paises/guardar}" th:object="${pais}" method="post" class="card card-body">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="codigoIso">Código ISO (2 o 3 letras)</label>
            <input type="text" id="codigoIso" th:field="*{codigoIso}" class="form-control"
                   th:classappend="${#fields.hasErrors('codigoIso')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{codigoIso}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="capital">Capital</label>
            <input type="text" id="capital" th:field="*{capital}" class="form-control"
                   th:classappend="${#fields.hasErrors('capital')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{capital}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="continente">Continente</label>
            <input type="text" id="continente" th:field="*{continente}" class="form-control"
                   th:classappend="${#fields.hasErrors('continente')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{continente}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="poblacion">Población</label>
            <input type="number" id="poblacion" th:field="*{poblacion}" class="form-control"
                   th:classappend="${#fields.hasErrors('poblacion')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{poblacion}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/paises}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
