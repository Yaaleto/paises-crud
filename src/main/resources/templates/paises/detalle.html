<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del país</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 640px">
    <h1 class="h3 mb-3">Detalle del país</h1>

    <div class="card card-body">
        <dl class="row mb-0">
            <dt class="col-sm-4">ID</dt>         <dd class="col-sm-8" th:text="${pais.id}"></dd>
            <dt class="col-sm-4">Nombre</dt>     <dd class="col-sm-8" th:text="${pais.nombre}"></dd>
            <dt class="col-sm-4">Código ISO</dt> <dd class="col-sm-8" th:text="${pais.codigoIso}"></dd>
            <dt class="col-sm-4">Capital</dt>    <dd class="col-sm-8" th:text="${pais.capital}"></dd>
            <dt class="col-sm-4">Continente</dt> <dd class="col-sm-8" th:text="${pais.continente}"></dd>
            <dt class="col-sm-4">Población</dt>
            <dd class="col-sm-8" th:text="${#numbers.formatInteger(pais.poblacion, 1, 'COMMA')}"></dd>
        </dl>
    </div>

    <div class="mt-3 d-flex gap-2">
        <a th:href="@{/paises/{id}/editar(id=${pais.id})}" class="btn btn-warning">Editar</a>
        <a th:href="@{/paises}" class="btn btn-secondary">Volver</a>
    </div>
</div>
</body>
</html>
