spring.application.name=paises-crud

# Dentro de Docker Compose estas variables las define el docker-compose.yml.
# Fuera de Docker usa los valores por defecto (MySQL en localhost:3307).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/paisesdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# La tabla la crea el script SQL, Hibernate solo la valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
